name: Build plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set plugin version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "PLUGIN_VERSION=$version" >> $env:GITHUB_ENV

      - name: Generate version files
        shell: pwsh
        run: ./Scripts/update-version.ps1 -Version $env:PLUGIN_VERSION

      - name: Build
        run: dotnet build QuickLook.Plugin.EpubViewer2/QuickLook.Plugin.EpubViewer2.csproj --configuration Release

      - name: Package
        shell: pwsh
        run: ./Scripts/pack-zip.ps1 -Configuration Release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuickLook.Plugin.EpubViewer2-package
          path: QuickLook.Plugin.EpubViewer2.qlplugin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: QuickLook.Plugin.EpubViewer2-package

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create $env:GITHUB_REF_NAME QuickLook.Plugin.EpubViewer2.qlplugin --generate-notes --title $env:GITHUB_REF_NAME
